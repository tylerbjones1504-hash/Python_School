<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Plant Predator Simulation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0f14;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #2ecc71;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(46, 204, 113, 0.5);
        }
    </style>
</head>
<body>

<div id="ui">
    <h2>Ecosystem Defense Grid</h2>
    <p>Entities Consumed: <span id="score">0</span></p>
</div>
<canvas id="simCanvas"></canvas>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    
    let width, height;
    let score = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- PROCEDURAL PLANT (FABRIK IK) ---
    class PlantCreature {
        constructor(numSegments, segmentLength) {
            this.numSegments = numSegments;
            this.segmentLength = segmentLength;
            this.baseX = 0;
            this.baseY = height / 2;
            this.segments = [];
            
            for(let i = 0; i < numSegments; i++) {
                this.segments.push({ x: this.baseX + i * segmentLength, y: this.baseY });
            }
        }

        update(targetX, targetY) {
            let pts = this.segments;
            let target = { x: targetX, y: targetY };

            // Cap maximum reach
            let dx = targetX - this.baseX;
            let dy = targetY - this.baseY;
            let dist = Math.sqrt(dx*dx + dy*dy);
            let maxReach = (this.numSegments - 1) * this.segmentLength;

            if (dist > maxReach) {
                target.x = this.baseX + (dx / dist) * maxReach;
                target.y = this.baseY + (dy / dist) * maxReach;
            }

            // FABRIK Solver (3 iterations for smoothness)
            for (let iter = 0; iter < 3; iter++) {
                // Forward pass (Head to Base)
                pts[this.numSegments - 1].x = target.x;
                pts[this.numSegments - 1].y = target.y;

                for (let i = this.numSegments - 2; i >= 0; i--) {
                    let dx = pts[i].x - pts[i+1].x;
                    let dy = pts[i].y - pts[i+1].y;
                    let d = Math.sqrt(dx*dx + dy*dy) || 1; // Prevent div by 0
                    pts[i].x = pts[i+1].x + (dx/d) * this.segmentLength;
                    pts[i].y = pts[i+1].y + (dy/d) * this.segmentLength;
                }

                // Backward pass (Base to Head)
                pts[0].x = this.baseX;
                pts[0].y = this.baseY;

                for (let i = 1; i < this.numSegments; i++) {
                    let dx = pts[i].x - pts[i-1].x;
                    let dy = pts[i].y - pts[i-1].y;
                    let d = Math.sqrt(dx*dx + dy*dy) || 1;
                    pts[i].x = pts[i-1].x + (dx/d) * this.segmentLength;
                    pts[i].y = pts[i-1].y + (dy/d) * this.segmentLength;
                }
            }
        }

        draw(ctx, distanceToTarget) {
            // Draw stalk with tapering and color gradient
            for (let i = 1; i < this.numSegments; i++) {
                ctx.beginPath();
                ctx.moveTo(this.segments[i-1].x, this.segments[i-1].y);
                ctx.lineTo(this.segments[i].x, this.segments[i].y);
                ctx.lineWidth = 35 * (1 - i / this.numSegments) + 5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = `hsl(145, 60%, ${25 + (i/this.numSegments)*35}%)`;
                ctx.stroke();
            }

            // Draw Head (Mouth)
            let head = this.segments[this.numSegments - 1];
            let prev = this.segments[this.numSegments - 2];
            let angle = Math.atan2(head.y - prev.y, head.x - prev.x);

            // Mouth snaps shut when close to prey
            let chompForce = Math.min(1, distanceToTarget / 150);
            let jawAngle = 0.1 + (chompForce * 0.7);

            ctx.save();
            ctx.translate(head.x, head.y);
            ctx.rotate(angle);
            
            // Jaws
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(0, 0, 24, jawAngle, Math.PI * 2 - jawAngle);
            ctx.lineTo(0, 0);
            ctx.fill();
            
            // Eye
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(-8, -10, 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
    }

    // --- ERRATIC PREY ENTITIES ---
    class Prey {
        constructor() {
            this.x = width + 50;
            this.baseY = 100 + Math.random() * (height - 200);
            this.y = this.baseY;
            this.vx = -(6 + Math.random() * 8); // High speed
            
            // Oscillation variables
            this.angle1 = Math.random() * Math.PI * 2;
            this.angle2 = Math.random() * Math.PI * 2;
            this.freq1 = 0.04 + Math.random() * 0.05;
            this.freq2 = 0.07 + Math.random() * 0.08;
            this.amp1 = 60 + Math.random() * 80;
            this.amp2 = 30 + Math.random() * 50;
            
            this.radius = 12;
            this.markedForDeletion = false;
        }

        update() {
            this.x += this.vx;
            this.angle1 += this.freq1;
            this.angle2 += this.freq2;
            // Compound sine wave for erratic, unpredictable movement
            this.y = this.baseY + Math.sin(this.angle1) * this.amp1 + Math.cos(this.angle2) * this.amp2;
        }

        draw(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#3498db';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#2980b9';
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Inner core
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = '#ecf0f1';
            ctx.fill();
        }
    }

    // --- PARTICLE EFFECTS ---
    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 15;
            this.vy = (Math.random() - 0.5) * 15;
            this.life = 1;
            this.decay = 0.03 + Math.random() * 0.04;
            this.color = color;
            this.size = 2 + Math.random() * 4;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vx *= 0.95; // Friction
            this.vy *= 0.95;
            this.life -= this.decay;
        }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    // --- SIMULATION ENGINE ---
    const plant = new PlantCreature(35, 25);
    const preys = [];
    const particles = [];
    let spawnTimer = 0;
    let headTarget = { x: 0, y: height / 2 };
    let idleAngle = 0;

    function animate() {
        requestAnimationFrame(animate);

        // Motion blur background
        ctx.fillStyle = 'rgba(10, 15, 20, 0.3)';
        ctx.fillRect(0, 0, width, height);

        // Manage Spawning
        spawnTimer++;
        if (spawnTimer > 35) {
            preys.push(new Prey());
            spawnTimer = 0;
        }

        // --- AI LOGIC ---
        let targetPrey = null;
        let minDistToLeft = Infinity;

        // Find the most urgent threat (closest to left wall)
        for (let p of preys) {
            if (p.x < minDistToLeft) {
                minDistToLeft = p.x;
                targetPrey = p;
            }
        }

        let currentDistToTarget = 999;

        if (targetPrey) {
            // Predict future position based on velocity for interception
            let predX = targetPrey.x + (targetPrey.vx * 3);
            let predY = targetPrey.y; // Oscillation is complex, track current Y
            
            headTarget.x += (predX - headTarget.x) * 0.25;
            headTarget.y += (predY - headTarget.y) * 0.25;

            // Base dynamically tracks Y axis to guarantee it can reach
            plant.baseY += (targetPrey.y - plant.baseY) * 0.08;
            
            // Calculate actual distance for mouth animation
            let head = plant.segments[plant.numSegments - 1];
            currentDistToTarget = Math.hypot(head.x - targetPrey.x, head.y - targetPrey.y);
        } else {
            // Idle organic floating
            idleAngle += 0.03;
            headTarget.x += ((300 + Math.cos(idleAngle) * 100) - headTarget.x) * 0.05;
            headTarget.y += ((height / 2 + Math.sin(idleAngle * 0.6) * 200) - headTarget.y) * 0.05;
            plant.baseY += ((height / 2) - plant.baseY) * 0.02;
        }

        plant.update(headTarget.x, headTarget.y);
        let head = plant.segments[plant.numSegments - 1];

        // --- UPDATE & COLLISION ---
        for (let i = preys.length - 1; i >= 0; i--) {
            let p = preys[i];
            p.update();
            p.draw(ctx);

            let dx = head.x - p.x;
            let dy = head.y - p.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            // Dynamic consume radius: if it gets too close to the left, plant lunges (radius expands)
            let consumeRadius = p.x < 250 ? 180 : 40;

            if (dist < consumeRadius || p.x < 50) { // Failsafe kill at x < 50
                p.markedForDeletion = true;
                score++;
                scoreElement.innerText = score;
                
                // Blood / Energy explosion
                for(let j=0; j<20; j++) {
                    particles.push(new Particle(p.x, p.y, '#3498db'));
                    particles.push(new Particle(p.x, p.y, '#e74c3c'));
                }
            }

            if (p.markedForDeletion) preys.splice(i, 1);
        }

        // --- PARTICLES ---
        for (let i = particles.length - 1; i >= 0; i--) {
            let pt = particles[i];
            pt.update();
            pt.draw(ctx);
            if (pt.life <= 0) particles.splice(i, 1);
        }

        plant.draw(ctx, currentDistToTarget);
    }

    animate();
</script>
</body>
</html>
